name: Controlli

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run verifica
      - run: npm test
      - run: npm run build
