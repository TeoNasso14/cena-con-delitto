<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Cena con delitto</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b14">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonti/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonti/grenze-gotisch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Riapplica l'ultimo tema visto prima che parta Angular, così non lampeggia Halloween (vedi src/app/temi/applica.ts).
    try {
      var t = JSON.parse(localStorage.getItem('cena-tema') || 'null');
      if (t && t.variabili) {
        var h = document.documentElement;
        for (var k in t.variabili) h.style.setProperty(k, t.variabili[k]);
        h.style.colorScheme = t.scuro ? 'dark' : 'light';
        h.dataset.tema = t.id;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t.variabili['--fondo']);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
